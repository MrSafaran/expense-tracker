services:
  postgres:
    image: postgres:17

    container_name: expense-tracker-db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: expense_tracker

    ports:
      - '5432:5432'

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5
  api:
    build: .

    container_name: expense-tracker-api

    ports:
      - '9090:9090'

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      PORT: 9090
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/expense_tracker?sslmode=disable

volumes:
  postgres_data:
